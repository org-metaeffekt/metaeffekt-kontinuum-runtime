projectProperties:
  project:
    id: "tc-0001"
    name: "Test Case #0001"
    version: "1.0.0"
    tenant: "ae"
  assets:
    - id: "app"
      name: "application"
      version: "1.0.0"
      reference: "${shared.workbench.dir}/inventories/reference-inventory/inventory"
      urlResolver:
        url: "file:${workspace.dir}/02_prepared/app/app-inventory.xlsx"
      assets:
        - id: "a"
          name: "a"
          extractionScript:
            script: "${workbench.dir}/scripts/select-inventory.kts"
            inventory: "a-inventory.xlsx"
            params:
              artifactIdPattern: "a-.*"
              inventoryPath: "${workbench.dir}/inventories"

# Result of the extract stage:
#  the parent inventory ${workspace.dir}/02_prepared/app/app-inventory.xlsx is fetched for asset 'app'
#  the script selects the single artifact matching artifactIdPattern from it (the match must be unique)
#  ${workbench.dir}/inventories/<artifact id>-inventory.xlsx is copied to
#  <runtime workspace>/tc-0001/01_extracted/a/scripted/a-inventory.xlsx
