#            params:
#              part: "os"
#        - id: "driver"
#          name: "Driver" script: "scripts/filter-part-inventory.kts"
#          extractionScript:
#            script: "scripts/filter-part-inventory.kts"
#            params:
#              part: "driver"
        - id: "sumatrapdf"
          name: "SumatraPDF"
          inventory: "sumatrapdf-inventory.xlsx"
          extractionScript:
            script: "scripts/select-inventory.kts"
            params:
              artifactIdPattern: "SumatraPDF-.*"
              inventoriesDir: "${workbench.dir}/inventories"
