log4j-core-PREPARE-7456a931-13fc-401c-a5f2-76ad271ca929:
  stage: PREPARE
  image: metaeffekt/metaeffekt-kontinuum-runtime:2.4.0
  script:
    - |
      set -o pipefail
      echo "Setup Command valid."
      mvn -X -f '/usr/src/metaeffekt-kontinuum/processors/advise/advise_attach-metadata.xml' process-resources \
      -Dinput.inventory.file='/metaeffekt-gitlab-examples/workspace/log4j-core-analysis/01_extracted/log4j-core/log4j-core.xlsx' \
      -Doutput.inventory.file='/metaeffekt-gitlab-examples/workspace/log4j-core-analysis/02_prepared/log4j-core/log4j-core.xlsx' \
      -Dparam.metadata.asset.id='log4j-core' \
      -Dparam.metadata.asset.name='log4j-core'

      echo "Setup Command valid."
      mvn -X -f '/usr/src/metaeffekt-kontinuum/processors/util/util_enrich-with-reference.xml' process-resources \
      -Dinput.inventory.file='/metaeffekt-gitlab-examples/workspace/log4j-core-analysis/02_prepared/log4j-core/log4j-core.xlsx' \
      -Doutput.inventory.file='/metaeffekt-gitlab-examples/workspace/log4j-core-analysis/02_prepared/log4j-core/log4j-core.xlsx' \
      -Dparam.reference.inventory.dir='workbench/inventories/example-reference-inventory/'

      echo "Setup Command valid."
      mvn -X -f '/usr/src/metaeffekt-kontinuum/processors/convert/convert_inventory-to-cyclonedx.xml' process-resources \
      -Dinput.inventory.file='/metaeffekt-gitlab-examples/workspace/log4j-core-analysis/02_prepared/log4j-core/log4j-core.xlsx' \
      -Doutput.bom.file='/metaeffekt-gitlab-examples/workspace/log4j-core-analysis/02_prepared/log4j-core/log4j-core-cyclonedx.json' \
      -Dparam.document.name='log4j-core' \
      -Dparam.document.organization='FIXME' \
      -Dparam.document.organization.url='FIXME' \
      -Dparam.document.output.format='JSON'

      echo "Setup Command valid."
      mvn -X -f '/usr/src/metaeffekt-kontinuum/processors/convert/convert_inventory-to-spdx.xml' process-resources \
      -Dinput.inventory.file='/metaeffekt-gitlab-examples/workspace/log4j-core-analysis/02_prepared/log4j-core/log4j-core.xlsx' \
      -Doutput.bom.file='/metaeffekt-gitlab-examples/workspace/log4j-core-analysis/02_prepared/log4j-core/log4j-core-spdx.json' \
      -Dparam.document.name='log4j-core' \
      -Dparam.document.organization='FIXME' \
      -Dparam.document.organization.url='FIXME' \
      -Dparam.document.output.format='JSON'

      echo "Setup Command valid."
      mvn -X -f '/usr/src/metaeffekt-kontinuum/processors/prepare/prepare_portfolio-upload.xml' process-resources \
      -Dinput.file='/metaeffekt-gitlab-examples/workspace/log4j-core-analysis/02_prepared/log4j-core/log4j-core.xlsx' \
      -Dparam.asset.group.id='log4j-core:2.24.3' \
      -Dparam.asset.name='log4j-core' \
      -Dparam.asset.version='2.24.3' \
      -Dparam.keystore.config.file='workbench/config/portfolio/pm-client-TEST-keystore.p12' \
      -Dparam.keystore.password='client-TEST-ks-pw' \
      -Dparam.portfolio.manager.token='3e6c4faa-4dfc-4bae-b711-22225768274f' \
      -Dparam.portfolio.manager.url='https://192.168.178.100:8444' \
      -Dparam.project.name='metaeffekt-examples' \
      -Dparam.truststore.config.file='workbench/config/portfolio/pm-client-TEST-truststore.p12' \
      -Dparam.truststore.password='client-TEST-ts-pw'

      echo "Setup Command valid."
      mvn -X -f '/usr/src/metaeffekt-kontinuum/processors/aggregate/aggregate_portfolio-download.xml' process-resources \
      -Doutput.inventory.dir='/metaeffekt-gitlab-examples/workspace/log4j-core-analysis/02_prepared/log4j-core/portfolio-manager/' \
      -Dparam.asset.group.id='Reports:SNAPSHOT' \
      -Dparam.asset.id='metaeffekt-examples' \
      -Dparam.inventory.modifier='report' \
      -Dparam.keystore.config.file='workbench/config/portfolio/pm-client-TEST-keystore.p12' \
      -Dparam.keystore.password='client-TEST-ks-pw' \
      -Dparam.portfolio.manager.token='3e6c4faa-4dfc-4bae-b711-22225768274f' \
      -Dparam.portfolio.manager.url='https://192.168.178.100:8444' \
      -Dparam.project.name='metaeffekt-examples' \
      -Dparam.truststore.config.file='workbench/config/portfolio/pm-client-TEST-truststore.p12' \
      -Dparam.truststore.password='client-TEST-ts-pw'
      find /metaeffekt-gitlab-examples/workspace/log4j-core-analysis/02_prepared/log4j-core/portfolio-manager/ -type f -name "*.zip" -print0 | while IFS= read -r -d '' zip_file; do
          zip_dir=$(dirname "$zip_file")
          unzip -q -j "$zip_file" "*_report.xlsx" "*_report.xls" -d "$zip_dir" || true
          extracted_file=$(find "$zip_dir" -maxdepth 1 -type f \( -name "*_report.xlsx" -o -name "*_report.xls" \) | head -n 1)
          if [ -n "$extracted_file" ]; then
              mv "$extracted_file" "/metaeffekt-gitlab-examples/workspace/log4j-core-analysis/02_prepared/log4j-core/portfolio-manager/log4j-core-pm-reference.xlsx"
          fi
      done


      2>&1 | tee $CI_JOB_NAME.log
  artifacts:
    when: on_failure
    paths:
      - $CI_JOB_NAME.log
    expire_in: 1 Week

