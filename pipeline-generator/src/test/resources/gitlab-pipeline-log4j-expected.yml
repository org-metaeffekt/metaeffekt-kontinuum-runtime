stages:
  - PRE
  - FETCH
  - EXTRACT
  - PREPARE
  - AGGREGATE
  - ADVISE
  - GROUP
  - REPORT
  - SUMMARIZE

variables:
  GIT_DEPTH: 1
  GIT_STRATEGY: clone
  CONTAINER_IMAGE: metaeffekt/metaeffekt-kontinuum-runtime:2.4.0

default:
  tags:
    - examples

pipeline-PRE-ea1e619a-ea63-4c2d-a054-65ea3372392a:
  stage: PRE
  image: metaeffekt/metaeffekt-kontinuum-runtime:2.4.0
  script:
    - |
      set -o pipefail
      echo "Setup Command valid."
      mvn -X -f '/usr/src/metaeffekt-kontinuum/processors/mirror/mirror_download-index.xml' process-resources \
      -Denv.vulnerability.mirror.dir='/metaeffekt-gitlab-examples/mirror/' \
      -Dparam.mirror.archive.url='http://ae-scanner/mirror/index/ae-mirror-index_gen7.tar.gz'

      2>&1 | tee $CI_JOB_NAME.log
  artifacts:
    when: on_failure
    paths:
      - $CI_JOB_NAME.log
    expire_in: 1 Week

