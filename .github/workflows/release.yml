name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version. Must be valid semantic versioning.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # The version only names the release tag; the POM bump is not committed, so main stays on HEAD-SNAPSHOT.
      - name: Set release version
        run: |
          mvn --batch-mode versions:set \
            -DnewVersion="${{ inputs.version }}" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true

      - name: Build runtime modules
        run: mvn --batch-mode clean package -DskipTests

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: "main"
          name: ${{ inputs.version }}
          draft: false
          prerelease: false
          files: |
            pipeline-generator/target/*.jar
            execution/target/*.jar
